name: Backup

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: echo 'matrix=[{"owner":"USA-RedDragon"},{"owner":"AstroGardenLLC"},{"owner":"kubewg-net"},{"owner":"USA-RedDragon-ORG"},{"owner":"SRS-Hosting"},{"owner":"Squallar"}]' >>"$GITHUB_OUTPUT"

  backup:
    name: Backup
    needs: [matrix]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        owners: ${{fromJson(needs.matrix.outputs.matrix)}}
    permissions:
      contents: read
    steps:
      - name: Configure B2 Credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.B2_APPLICATION_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.B2_APPLICATION_KEY }}"
          aws configure set region auto
      - name: GitHub Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owners.owner }}
      - name: Backup repos
        id: backup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -eu
          gh auth setup-git
          # Pre-initialize GPG home to avoid race condition across parallel workers
          gpg --batch --list-keys >/dev/null 2>&1 || true
          do_backup() (
            set -euo pipefail
            source <(yq -p=json -o=shell <<<"$1")
            owner="${{ matrix.owners.owner }}"
            endpoint="${{ secrets.B2_ENDPOINT_URL }}"
            reponame="${owner}_$name"
            repodir="$owner/$name"
            key="$repodir/$reponame.tar.zst.gpg"
            fingerprint=$(git ls-remote "https://github.com/$owner/$name" | sha256sum | cut -d' ' -f1)
            stored=$(aws s3api head-object --bucket mcswain-git-backups --key "$key" --endpoint-url "$endpoint" --query Metadata.fingerprint --output text 2>/dev/null || true)
            if [ "$stored" = "$fingerprint" ]; then
              echo "unchanged $repodir"
              exit 0
            fi
            git clone --mirror "https://github.com/$owner/$name" "$reponame"
            tar --sort=name --mtime="$pushedAt" -cf - "$reponame" \
              | zstd -q -T0 \
              | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
                --symmetric --cipher-algo AES256 --compress-algo none \
                --output "$reponame.tar.zst.gpg"
            rm -rf "$reponame"
            du -sh "$reponame.tar.zst.gpg"
            aws s3 cp "$reponame.tar.zst.gpg" "s3://mcswain-git-backups/$key" --metadata "fingerprint=$fingerprint" --endpoint-url "$endpoint"
            rm -f "$reponame.tar.zst.gpg"
            if aws s3 ls "s3://mcswain-git-backups/$repodir/$reponame.tar.gpg" --endpoint-url "$endpoint" >/dev/null; then
              aws s3 rm "s3://mcswain-git-backups/$repodir/$reponame.tar.gpg" --endpoint-url "$endpoint"
            fi
          )
          export -f do_backup
          gh repo list --limit=9999 --json name,pushedAt,isArchived ${{ matrix.owners.owner }} \
            | jq -c 'sort_by(.name | ascii_downcase) | .[]' \
            | parallel do_backup 2>&1
